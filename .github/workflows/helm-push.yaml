name: Package Helm Chart and publish to GitHub Packages

on:
  workflow_dispatch: { }
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  helm-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1

      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6
        with:
          python-version: 3.9
          check-latest: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Log into registry ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if Helm chart with same version already exists
        id: check-chart
        run: |
          chartName=$(yq .name "charts/owner-label-injector/Chart.yaml")
          chartVersion=$(yq .version "charts/owner-label-injector/Chart.yaml")
          echo "chart_version=${chartVersion}" >> "$GITHUB_OUTPUT"
          if $(helm pull "oci://${{ env.REGISTRY }}/${{ github.repository }}/charts/owner-label-injector" --version $chartVersion); then
            echo "bump=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Chart needs version bump
        if: steps.check-chart.outputs.bump == 'true'
        env:
          CHART_VERSION: ${{ steps.check-chart.outputs.chart_version }}
        run: |
          echo "Chart owner-label-injector:${{ env.CHART_VERSION }} already exists in OCI registry. Skipping upload. Please increment the chart version."
          exit 1

      - name: Push Charts to GHCR
        if: steps.check-chart.outputs.bump != 'true'
        run: |
          helm dependency update charts/owner-label-injector
          helm package charts/owner-label-injector -d charts/owner-label-injector
          PKG_NAME=`ls charts/owner-label-injector/*.tgz`
          helm push ${PKG_NAME} oci://${{ env.REGISTRY }}/${{ github.repository }}/charts/
